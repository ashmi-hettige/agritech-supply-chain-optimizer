spring.application.name=agritech-optimizer
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=http://localhost:5173
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Ashmi Hettige}

# Best-market advisor transport model (LKR):
# cost = fixed-cost + rate-per-kg-km x kg x (straight-line km x road-factor)
app.transport.rate-per-kg-km=0.05
app.transport.fixed-cost=500
app.transport.road-factor=1.3
